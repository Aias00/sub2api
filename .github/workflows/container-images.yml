name: Container Images

on:
  push:
    branches:
      - main
      - master
      - cloudbase
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Additional image tag to publish, for example production'
        required: false
        default: latest
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: container-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push images
    runs-on: ubuntu-latest
    env:
      ALIYUN_ACR_REGISTRY: ${{ secrets.ALIYUN_ACR_REGISTRY }}
      ALIYUN_ACR_NAMESPACE: ${{ secrets.ALIYUN_ACR_NAMESPACE }}
      ALIYUN_ACR_USERNAME: ${{ secrets.ALIYUN_ACR_USERNAME }}
      ALIYUN_ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: Dockerfile
            context: .
            suffix: ''
          - name: wechat-worker
            dockerfile: tools/wechat-worker.Dockerfile
            context: tools
            suffix: '-wechat-worker'
          - name: image-workspace-worker
            dockerfile: tools/image-workspace-worker.Dockerfile
            context: tools
            suffix: '-image-workspace-worker'
          - name: content-worker
            dockerfile: tools/content-worker.Dockerfile
            context: tools
            suffix: '-content-worker'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set image metadata
        id: meta
        shell: bash
        env:
          EXTRA_IMAGE_TAG: ${{ github.event.inputs.image_tag || '' }}
        run: |
          set -euo pipefail
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          repo="cloudbase"
          image="ghcr.io/${owner}/${repo}${{ matrix.suffix }}"
          short_sha="${GITHUB_SHA::12}"

          tags=()
          tag_names=("sha-${short_sha}")
          if [[ "${GITHUB_REF_TYPE}" == "branch" ]]; then
            ref_name="$(echo "${GITHUB_REF_NAME}" | tr '/[:upper:]' '-[:lower:]')"
            tag_names+=("${ref_name}")
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            tag_names+=("${GITHUB_REF_NAME}" "${version}")
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${EXTRA_IMAGE_TAG}" ]]; then
            tag_names+=("${EXTRA_IMAGE_TAG}")
          fi
          if [[ "${GITHUB_REF_NAME}" == "${{ github.event.repository.default_branch }}" ]]; then
            tag_names+=("latest")
          fi

          for tag in "${tag_names[@]}"; do
            tags+=("${image}:${tag}")
          done

          acr_registry="${ALIYUN_ACR_REGISTRY%/}"
          acr_namespace="${ALIYUN_ACR_NAMESPACE#/}"
          acr_namespace="${acr_namespace%/}"
          if [[ -n "${acr_registry}" && -n "${acr_namespace}" && -n "${ALIYUN_ACR_USERNAME}" && -n "${ALIYUN_ACR_PASSWORD}" ]]; then
            acr_image="${acr_registry}/${acr_namespace}/${repo}${{ matrix.suffix }}"
            for tag in "${tag_names[@]}"; do
              tags+=("${acr_image}:${tag}")
            done
          fi

          {
            echo "image=${image}"
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Aliyun Container Registry
        if: ${{ env.ALIYUN_ACR_REGISTRY != '' && env.ALIYUN_ACR_USERNAME != '' && env.ALIYUN_ACR_PASSWORD != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_ACR_REGISTRY }}
          username: ${{ env.ALIYUN_ACR_USERNAME }}
          password: ${{ env.ALIYUN_ACR_PASSWORD }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=cloudbase-${{ matrix.name }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
