# Optional Sub2API config override.
#
# The current Docker deployment is env-first:
# - deploy/.env stores secrets and runtime variables.
# - docker-compose*.yml passes those variables into containers.
# - config.yaml is optional and should only contain settings that cannot be
#   expressed cleanly as environment variables.
#
# To use this file for a binary/non-compose deployment, copy it to one of:
# - ./config.yaml
# - ./config/config.yaml
# - /etc/sub2api/config.yaml
#
# For the local Docker deployment, prefer leaving deploy/data/config.yaml absent.

# Example optional overrides:
# server:
#   frontend_url: "https://example.com"
#
# cors:
#   allowed_origins:
#     - "https://example.com"
#   allow_credentials: true
#
# security:
#   url_allowlist:
#     enabled: true
#     upstream_hosts:
#       - "api.openai.com"
#       - "api.anthropic.com"
