# Content workflow workers.
#
# The split workers are the primary path:
# - hot-worker only runs Hot RSS collection.
# - x-auto-worker only runs the X Auto API/scheduler.

x-hot-worker-env: &hot-worker-env
  - DATABASE_URL=${HOT_DATABASE_URL:-postgres://cloudbase:${POSTGRES_PASSWORD}@postgres:5432/cloudbase?sslmode=disable}
  - HOT_WORKER_STATUS_PATH=${HOT_WORKER_STATUS_PATH:-/app/runtime/hot-worker-status.json}
  - HOT_RSS_WORKER_STATUS_PATH=${HOT_RSS_WORKER_STATUS_PATH:-/app/runtime/hot-worker-status.json}
  - HOT_RSS_COLLECT_INTERVAL_MS=${HOT_RSS_COLLECT_INTERVAL_MS:-1800000}
  - HOT_RSS_COLLECT_MAX_BACKOFF_MS=${HOT_RSS_COLLECT_MAX_BACKOFF_MS:-600000}
  - HOT_RSS_COLLECT_ON_START=${HOT_RSS_COLLECT_ON_START:-true}
  - HOT_RSS_LIMIT_PER_SOURCE=${HOT_RSS_LIMIT_PER_SOURCE:-10}
  - HOT_RSS_SOURCE_CONCURRENCY=${HOT_RSS_SOURCE_CONCURRENCY:-6}
  - HOT_RSS_REQUEST_TIMEOUT_MS=${HOT_RSS_REQUEST_TIMEOUT_MS:-20000}
  - HOT_RSS_WORKER_HEALTH_MAX_AGE_MS=${HOT_RSS_WORKER_HEALTH_MAX_AGE_MS:-0}
  - HOT_AI_ENRICH_ENABLED=${HOT_AI_ENRICH_ENABLED:-true}
  - HOT_AI_API_KEY=${HOT_AI_API_KEY:-}
  - HOT_AI_BASE_URL=${HOT_AI_BASE_URL:-https://api.openai.com/v1}
  - HOT_AI_MODEL=${HOT_AI_MODEL:-gpt-4o-mini}
  - HOT_AI_TIMEOUT_MS=${HOT_AI_TIMEOUT_MS:-30000}
  - HOT_AI_MAX_ITEMS_PER_SOURCE=${HOT_AI_MAX_ITEMS_PER_SOURCE:-5}
  - HOT_AI_MAX_ITEMS_PER_RUN=${HOT_AI_MAX_ITEMS_PER_RUN:-20}
  - HOT_RANK_CLEAN_ENABLED=${HOT_RANK_CLEAN_ENABLED:-true}
  - HOT_RANK_CLEAN_RECENT_DAYS=${HOT_RANK_CLEAN_RECENT_DAYS:-7}
  - HOT_RANK_CLEAN_MAX_PER_SOURCE=${HOT_RANK_CLEAN_MAX_PER_SOURCE:-2}

x-x-auto-worker-env: &x-auto-worker-env
  - X_AUTO_PORT=${X_AUTO_PORT:-8000}
  - X_ATUO_ENVIRONMENT=${X_ATUO_ENVIRONMENT:-production}
  - X_ATUO_DATA_DIR=${X_ATUO_DATA_DIR:-/app/data}
  - X_ATUO_DATABASE_URL=${X_ATUO_DATABASE_URL:-postgres://cloudbase:${POSTGRES_PASSWORD}@postgres:5432/cloudbase?sslmode=disable}
  - X_ATUO_AUTHOR_ALPHA__DATABASE_URL=${X_ATUO_AUTHOR_ALPHA_DATABASE_URL:-postgres://cloudbase:${POSTGRES_PASSWORD}@postgres:5432/cloudbase?sslmode=disable}
  - X_ATUO_SCHEDULER__ENABLED=${X_ATUO_SCHEDULER_ENABLED:-false}
  - X_ATUO_SCHEDULER__AUTOSTART=${X_ATUO_SCHEDULER_AUTOSTART:-false}
  - X_ATUO_TWITTER__PROXY_URL=${X_AUTO_PROXY_URL:-}
  - X_ATUO_TWITTER__AUTH_TOKEN_ENV=${X_ATUO_TWITTER_AUTH_TOKEN_ENV:-TWITTER_AUTH_TOKEN}
  - X_ATUO_TWITTER__CT0_ENV=${X_ATUO_TWITTER_CT0_ENV:-TWITTER_CT0}
  - TWITTER_AUTH_TOKEN=${TWITTER_AUTH_TOKEN:-}
  - TWITTER_CT0=${TWITTER_CT0:-}

services:
  hot-worker:
    build:
      context: ../tools
      dockerfile: hot-worker.Dockerfile
    image: cloudbase-hot-worker:${HOT_WORKER_IMAGE_TAG:-local}
    container_name: ${HOT_WORKER_CONTAINER_NAME:-cloudbase-hot-worker}
    restart: unless-stopped
    profiles:
      - content-worker
      - hot-worker
    environment: *hot-worker-env
    volumes:
      - ${HOT_RUNTIME_MOUNT:-./runtime}:/app/runtime
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cloudbase-network

  x-auto-worker:
    build:
      context: ../tools
      dockerfile: x-auto-worker.Dockerfile
    image: cloudbase-x-auto-worker:${X_AUTO_WORKER_IMAGE_TAG:-local}
    container_name: ${X_AUTO_WORKER_CONTAINER_NAME:-cloudbase-x-auto-worker}
    restart: unless-stopped
    profiles:
      - content-worker
      - x-auto-worker
    environment: *x-auto-worker-env
    volumes:
      - ${X_AUTO_WORKER_DATA_MOUNT:-./data/x-auto}:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cloudbase-network
