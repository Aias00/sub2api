# Optional Hot Content RSS collector worker overlay.
#
# This worker reads enabled RSS sources from Sub2API PostgreSQL and writes
# collected Hot content directly back to PostgreSQL.
#
# Usage with the default deployment:
#   docker compose -f docker-compose.yml -f docker-compose.hot-worker.yml --profile hot-worker up -d

services:
  hot-rss-collector-worker:
    build:
      context: ../tools
      dockerfile: hot-rss-collector-worker.Dockerfile
    image: sub2api-hot-rss-collector-worker:${HOT_RSS_COLLECTOR_WORKER_IMAGE_TAG:-local}
    container_name: sub2api-hot-rss-collector-worker
    restart: unless-stopped
    profiles:
      - hot-worker
    command: ["node", "hot-rss-collector-worker.mjs"]
    environment:
      - DATABASE_URL=${HOT_DATABASE_URL:-postgres://sub2api:${POSTGRES_PASSWORD}@postgres:5432/sub2api?sslmode=disable}
      - HOT_WORKER_STATUS_PATH=${HOT_WORKER_STATUS_PATH:-/app/runtime/hot-worker-status.json}
      - HOT_RSS_WORKER_STATUS_PATH=${HOT_RSS_WORKER_STATUS_PATH:-/app/runtime/hot-worker-status.json}
      - HOT_RSS_COLLECT_INTERVAL_MS=${HOT_RSS_COLLECT_INTERVAL_MS:-1800000}
      - HOT_RSS_COLLECT_MAX_BACKOFF_MS=${HOT_RSS_COLLECT_MAX_BACKOFF_MS:-600000}
      - HOT_RSS_COLLECT_ON_START=${HOT_RSS_COLLECT_ON_START:-true}
      - HOT_RSS_LIMIT_PER_SOURCE=${HOT_RSS_LIMIT_PER_SOURCE:-10}
      - HOT_RSS_REQUEST_TIMEOUT_MS=${HOT_RSS_REQUEST_TIMEOUT_MS:-20000}
      - HOT_RSS_WORKER_HEALTH_MAX_AGE_MS=${HOT_RSS_WORKER_HEALTH_MAX_AGE_MS:-0}
    volumes:
      - ${HOT_RUNTIME_MOUNT:-./runtime}:/app/runtime
    depends_on:
      - postgres
    networks:
      - sub2api-network
    healthcheck:
      test: ["CMD", "node", "hot-rss-collector-worker.mjs", "--healthcheck"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
