# Optional Image Workspace worker overlay.
#
# Usage with the default named-volume deployment:
#   docker compose -f docker-compose.yml -f docker-compose.image-worker.yml --profile image-worker up -d
#
# Usage with docker-compose.local.yml:
#   IMAGE_WORKSPACE_DATA_MOUNT=./data docker compose -f docker-compose.local.yml -f docker-compose.image-worker.yml --profile image-worker up -d

services:
  image-workspace-worker:
    build:
      context: ../tools/image-workspace-worker
      dockerfile: Dockerfile
    image: sub2api-image-workspace-worker:${IMAGE_WORKSPACE_WORKER_IMAGE_TAG:-local}
    container_name: sub2api-image-workspace-worker
    restart: unless-stopped
    profiles:
      - image-worker
    environment:
      - IMAGE_WORKSPACE_API_BASE_URL=${IMAGE_WORKSPACE_API_BASE_URL:-http://sub2api:8080}
      - IMAGE_WORKSPACE_WORKER_TOKEN=${IMAGE_WORKSPACE_WORKER_TOKEN:-}
      - IMAGE_WORKSPACE_UPSTREAM_URL=${IMAGE_WORKSPACE_UPSTREAM_URL:-https://api.openai.com/v1/images/generations}
      - IMAGE_WORKSPACE_UPSTREAM_API_KEY=${IMAGE_WORKSPACE_UPSTREAM_API_KEY:-}
      - IMAGE_WORKSPACE_OUTPUT_DIR=${IMAGE_WORKSPACE_OUTPUT_DIR:-/app/data/image-workspace}
      - IMAGE_WORKSPACE_STORAGE_KEY_ROOT=${IMAGE_WORKSPACE_STORAGE_KEY_ROOT:-/app/data/image-workspace}
      - IMAGE_WORKSPACE_PUBLIC_ARTIFACT_BASE_URL=${IMAGE_WORKSPACE_PUBLIC_ARTIFACT_BASE_URL:-}
      - IMAGE_WORKSPACE_PUBLIC_STORAGE_KEY_ROOT=${IMAGE_WORKSPACE_PUBLIC_STORAGE_KEY_ROOT:-}
      - IMAGE_WORKSPACE_OBJECT_STORAGE_ENABLED=${IMAGE_WORKSPACE_OBJECT_STORAGE_ENABLED:-false}
      - IMAGE_WORKSPACE_OBJECT_STORAGE_PROVIDER=${IMAGE_WORKSPACE_OBJECT_STORAGE_PROVIDER:-r2}
      - IMAGE_WORKSPACE_OBJECT_STORAGE_ENDPOINT=${IMAGE_WORKSPACE_OBJECT_STORAGE_ENDPOINT:-}
      - IMAGE_WORKSPACE_OBJECT_STORAGE_ACCESS_KEY_ID=${IMAGE_WORKSPACE_OBJECT_STORAGE_ACCESS_KEY_ID:-}
      - IMAGE_WORKSPACE_OBJECT_STORAGE_SECRET_ACCESS_KEY=${IMAGE_WORKSPACE_OBJECT_STORAGE_SECRET_ACCESS_KEY:-}
      - IMAGE_WORKSPACE_OBJECT_STORAGE_BUCKET=${IMAGE_WORKSPACE_OBJECT_STORAGE_BUCKET:-}
      - IMAGE_WORKSPACE_OBJECT_STORAGE_REGION=${IMAGE_WORKSPACE_OBJECT_STORAGE_REGION:-auto}
      - IMAGE_WORKSPACE_OBJECT_STORAGE_PREFIX=${IMAGE_WORKSPACE_OBJECT_STORAGE_PREFIX:-image-workspace}
      - IMAGE_WORKSPACE_OBJECT_STORAGE_PUBLIC_BASE_URL=${IMAGE_WORKSPACE_OBJECT_STORAGE_PUBLIC_BASE_URL:-}
      - IMAGE_WORKSPACE_OBJECT_STORAGE_CACHE_CONTROL=${IMAGE_WORKSPACE_OBJECT_STORAGE_CACHE_CONTROL:-public, max-age=31536000, immutable}
      - IMAGE_WORKSPACE_R2_ACCOUNT_ID=${IMAGE_WORKSPACE_R2_ACCOUNT_ID:-}
      - IMAGE_WORKSPACE_R2_ENDPOINT=${IMAGE_WORKSPACE_R2_ENDPOINT:-}
      - IMAGE_WORKSPACE_R2_ACCESS_KEY_ID=${IMAGE_WORKSPACE_R2_ACCESS_KEY_ID:-}
      - IMAGE_WORKSPACE_R2_ACCESS_KEY=${IMAGE_WORKSPACE_R2_ACCESS_KEY:-}
      - IMAGE_WORKSPACE_R2_SECRET_ACCESS_KEY=${IMAGE_WORKSPACE_R2_SECRET_ACCESS_KEY:-}
      - IMAGE_WORKSPACE_R2_SECRET_KEY=${IMAGE_WORKSPACE_R2_SECRET_KEY:-}
      - IMAGE_WORKSPACE_R2_BUCKET=${IMAGE_WORKSPACE_R2_BUCKET:-}
      - IMAGE_WORKSPACE_R2_BUCKET_NAME=${IMAGE_WORKSPACE_R2_BUCKET_NAME:-}
      - IMAGE_WORKSPACE_R2_UPLOAD_PATH=${IMAGE_WORKSPACE_R2_UPLOAD_PATH:-}
      - IMAGE_WORKSPACE_R2_DOMAIN=${IMAGE_WORKSPACE_R2_DOMAIN:-}
      - IMAGE_WORKSPACE_WORKER_INTERVAL_MS=${IMAGE_WORKSPACE_WORKER_INTERVAL_MS:-5000}
      - IMAGE_WORKSPACE_WORKER_MAX_BACKOFF_MS=${IMAGE_WORKSPACE_WORKER_MAX_BACKOFF_MS:-60000}
      - IMAGE_WORKSPACE_WORKER_LEASE_SECONDS=${IMAGE_WORKSPACE_WORKER_LEASE_SECONDS:-300}
      - IMAGE_WORKSPACE_GENERATION_TIMEOUT_MS=${IMAGE_WORKSPACE_GENERATION_TIMEOUT_MS:-420000}
      - IMAGE_WORKSPACE_COMPLETION_COST=${IMAGE_WORKSPACE_COMPLETION_COST:-0}
      - IMAGE_WORKSPACE_COMPLETION_COST_MAP_JSON=${IMAGE_WORKSPACE_COMPLETION_COST_MAP_JSON:-}
      - IMAGE_WORKSPACE_PROMPT_SAFETY_ENABLED=${IMAGE_WORKSPACE_PROMPT_SAFETY_ENABLED:-true}
    volumes:
      - ${IMAGE_WORKSPACE_DATA_MOUNT:-sub2api_data}:/app/data
    depends_on:
      - sub2api
    networks:
      - sub2api-network
