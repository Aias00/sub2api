# Production image override.
# Use this after CI has pushed images to GHCR. It removes local build contexts
# from worker services so production only pulls and restarts containers.

services:
  cloudbase:
    image: ${CLOUDBASE_IMAGE:-ghcr.io/aias00/cloudbase:${CLOUDBASE_IMAGE_TAG:-latest}}

  wechat-worker:
    build: !reset null
    image: ${WECHAT_WORKER_IMAGE:-ghcr.io/aias00/cloudbase-wechat-worker:${WECHAT_WORKER_IMAGE_TAG:-latest}}

  image-workspace-worker:
    build: !reset null
    image: ${IMAGE_WORKSPACE_WORKER_IMAGE:-ghcr.io/aias00/cloudbase-image-workspace-worker:${IMAGE_WORKSPACE_WORKER_IMAGE_TAG:-latest}}

  content-worker:
    build: !reset null
    image: ${CONTENT_WORKER_IMAGE:-ghcr.io/aias00/cloudbase-content-worker:${CONTENT_WORKER_IMAGE_TAG:-latest}}
