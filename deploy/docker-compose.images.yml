# Production image override.
# Use this after CI has pushed images to GHCR. It removes local build contexts
# from worker services so production only pulls and restarts containers.

services:
  cloudbase:
    image: ${CLOUDBASE_IMAGE:-ghcr.io/aias00/cloudbase:${CLOUDBASE_IMAGE_TAG:-latest}}
    platform: ${CLOUDBASE_IMAGE_PLATFORM:-linux/amd64}

  wechat-worker:
    build: !reset null
    image: ${WECHAT_WORKER_IMAGE:-ghcr.io/aias00/cloudbase-wechat-worker:${WECHAT_WORKER_IMAGE_TAG:-latest}}
    platform: ${WECHAT_WORKER_IMAGE_PLATFORM:-linux/amd64}

  image-workspace-worker:
    build: !reset null
    image: ${IMAGE_WORKSPACE_WORKER_IMAGE:-ghcr.io/aias00/cloudbase-image-workspace-worker:${IMAGE_WORKSPACE_WORKER_IMAGE_TAG:-latest}}
    platform: ${IMAGE_WORKSPACE_WORKER_IMAGE_PLATFORM:-linux/amd64}

  hot-worker:
    build: !reset null
    image: ${HOT_WORKER_IMAGE:-ghcr.io/aias00/cloudbase-hot-worker:${HOT_WORKER_IMAGE_TAG:-latest}}
    platform: ${HOT_WORKER_IMAGE_PLATFORM:-linux/amd64}

  x-auto-worker:
    build: !reset null
    image: ${X_AUTO_WORKER_IMAGE:-ghcr.io/aias00/cloudbase-x-auto-worker:${X_AUTO_WORKER_IMAGE_TAG:-latest}}
    platform: ${X_AUTO_WORKER_IMAGE_PLATFORM:-linux/amd64}
