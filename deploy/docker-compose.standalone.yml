# =============================================================================
# Cloudbase Docker Compose - Standalone Configuration
# =============================================================================
# This configuration runs only the Cloudbase application.
# PostgreSQL and Redis must be provided externally.
#
# Usage:
#   1. Copy .env.example to .env and configure database/redis connection
#   2. docker-compose -f docker-compose.standalone.yml up -d
#   3. Access: http://localhost:8080
# =============================================================================

services:
  cloudbase:
    image: weishaw/cloudbase:latest
    container_name: cloudbase
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    ports:
      - "${BIND_HOST:-0.0.0.0}:${SERVER_PORT:-8080}:8080"
    volumes:
      - cloudbase_data:/app/data
      - ${HOT_RUNTIME_MOUNT:-./runtime}:/app/runtime:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # =======================================================================
      # Auto Setup
      # =======================================================================
      - AUTO_SETUP=true

      # =======================================================================
      # Server Configuration
      # =======================================================================
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - SERVER_MODE=${SERVER_MODE:-release}
      - SERVER_FRONTEND_URL=${SERVER_FRONTEND_URL:-}
      - SERVER_TRUSTED_PROXIES=${SERVER_TRUSTED_PROXIES:-}
      - RUN_MODE=${RUN_MODE:-standard}

      # =======================================================================
      # Database Configuration (PostgreSQL) - Required
      # =======================================================================
      - DATABASE_HOST=${DATABASE_HOST:?DATABASE_HOST is required}
      - DATABASE_PORT=${DATABASE_PORT:-5432}
      - DATABASE_USER=${DATABASE_USER:-cloudbase}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      - DATABASE_DBNAME=${DATABASE_DBNAME:-cloudbase}
      - DATABASE_SSLMODE=${DATABASE_SSLMODE:-disable}
      - DATABASE_MAX_OPEN_CONNS=${DATABASE_MAX_OPEN_CONNS:-50}
      - DATABASE_MAX_IDLE_CONNS=${DATABASE_MAX_IDLE_CONNS:-10}
      - DATABASE_CONN_MAX_LIFETIME_MINUTES=${DATABASE_CONN_MAX_LIFETIME_MINUTES:-30}
      - DATABASE_CONN_MAX_IDLE_TIME_MINUTES=${DATABASE_CONN_MAX_IDLE_TIME_MINUTES:-5}

      # =======================================================================
      # Redis Configuration - Required
      # =======================================================================
      - REDIS_HOST=${REDIS_HOST:?REDIS_HOST is required}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_POOL_SIZE=${REDIS_POOL_SIZE:-1024}
      - REDIS_MIN_IDLE_CONNS=${REDIS_MIN_IDLE_CONNS:-10}
      - REDIS_ENABLE_TLS=${REDIS_ENABLE_TLS:-false}

      # =======================================================================
      # Admin Account (auto-created on first run)
      # =======================================================================
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@cloudbase.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}

      # =======================================================================
      # JWT Configuration
      # =======================================================================
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_EXPIRE_HOUR=${JWT_EXPIRE_HOUR:-24}
      - WECHAT_EXPORT_WORKER_TOKEN=${WECHAT_EXPORT_WORKER_TOKEN:-}
      - WECHAT_EXPORT_ALLOW_PRIVATE_WORKER_WITHOUT_TOKEN=${WECHAT_EXPORT_ALLOW_PRIVATE_WORKER_WITHOUT_TOKEN:-false}
      - WECHAT_EXPORT_OUTPUT_DIR=${WECHAT_EXPORT_OUTPUT_DIR:-/app/data/wechat-export}
      - WECHAT_EXPORT_STORAGE_ROOT=${WECHAT_EXPORT_STORAGE_ROOT:-/app/data/wechat-export}
      - WECHAT_EXPORT_STORAGE_KEY_ROOT=${WECHAT_EXPORT_STORAGE_KEY_ROOT:-/app/data/wechat-export}
      - WECHAT_EXPORT_ZIP_REMOTE_HOST_ALLOWLIST=${WECHAT_EXPORT_ZIP_REMOTE_HOST_ALLOWLIST:-}
      - IMAGE_WORKSPACE_WORKER_TOKEN=${IMAGE_WORKSPACE_WORKER_TOKEN:-}
      - IMAGE_WORKSPACE_ALLOW_PRIVATE_WORKER_WITHOUT_TOKEN=${IMAGE_WORKSPACE_ALLOW_PRIVATE_WORKER_WITHOUT_TOKEN:-false}
      - IMAGE_WORKSPACE_OUTPUT_DIR=${IMAGE_WORKSPACE_OUTPUT_DIR:-/app/data/image-workspace}
      - IMAGE_WORKSPACE_STORAGE_ROOT=${IMAGE_WORKSPACE_STORAGE_ROOT:-/app/data/image-workspace}
      - IMAGE_WORKSPACE_STORAGE_KEY_ROOT=${IMAGE_WORKSPACE_STORAGE_KEY_ROOT:-/app/data/image-workspace}
      - IMAGE_WORKSPACE_UPSTREAM_API_KEY=${IMAGE_WORKSPACE_UPSTREAM_API_KEY:-}
      - IMAGE_WORKSPACE_OBJECT_STORAGE_ENDPOINT=${IMAGE_WORKSPACE_OBJECT_STORAGE_ENDPOINT:-}
      - IMAGE_WORKSPACE_R2_ACCOUNT_ID=${IMAGE_WORKSPACE_R2_ACCOUNT_ID:-}
      - IMAGE_WORKSPACE_R2_ENDPOINT=${IMAGE_WORKSPACE_R2_ENDPOINT:-}
      - HOT_WORKER_STATUS_PATH=${HOT_WORKER_STATUS_PATH:-/app/runtime/hot-worker-status.json}
      - HOT_WORKER_HEALTH_MAX_AGE_MS=${HOT_WORKER_HEALTH_MAX_AGE_MS:-0}
      - HOT_CONTENT_CAPABILITY_ASSUME_EXTERNAL_WORKER_READY=${HOT_CONTENT_CAPABILITY_ASSUME_EXTERNAL_WORKER_READY:-false}
      - WORKER_MANAGER_ENABLED=${WORKER_MANAGER_ENABLED:-false}
      - WORKER_MANAGER_DOCKER_SOCKET=${WORKER_MANAGER_DOCKER_SOCKET:-/var/run/docker.sock}
      - WECHAT_WORKER_CONTAINER_NAME=${WECHAT_WORKER_CONTAINER_NAME:-cloudbase-wechat-worker}
      - IMAGE_WORKSPACE_WORKER_CONTAINER_NAME=${IMAGE_WORKSPACE_WORKER_CONTAINER_NAME:-cloudbase-image-workspace-worker}
      - HOT_WORKER_CONTAINER_NAME=${HOT_WORKER_CONTAINER_NAME:-cloudbase-content-worker}
      - X_AUTO_BASE_URL=${X_AUTO_BASE_URL:-http://content-worker:8000}
      - CONTENT_WORKER_CONTAINER_NAME=${CONTENT_WORKER_CONTAINER_NAME:-cloudbase-content-worker}

      # =======================================================================
      # Setup Configuration
      # =======================================================================
      - SETUP_MIGRATION_TIMEOUT_SECONDS=${SETUP_MIGRATION_TIMEOUT_SECONDS:-0}

      # =======================================================================
      # Timezone Configuration
      # =======================================================================
      - TZ=${TZ:-Asia/Shanghai}

      # =======================================================================
      # CORS and Security Configuration
      # =======================================================================
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - CORS_ALLOW_CREDENTIALS=${CORS_ALLOW_CREDENTIALS:-true}
      - SECURITY_URL_ALLOWLIST_ENABLED=${SECURITY_URL_ALLOWLIST_ENABLED:-true}
      - SECURITY_URL_ALLOWLIST_ALLOW_INSECURE_HTTP=${SECURITY_URL_ALLOWLIST_ALLOW_INSECURE_HTTP:-false}
      - SECURITY_URL_ALLOWLIST_ALLOW_PRIVATE_HOSTS=${SECURITY_URL_ALLOWLIST_ALLOW_PRIVATE_HOSTS:-false}
      - SECURITY_URL_ALLOWLIST_UPSTREAM_HOSTS=${SECURITY_URL_ALLOWLIST_UPSTREAM_HOSTS:-}
      - SECURITY_URL_ALLOWLIST_PRICING_HOSTS=${SECURITY_URL_ALLOWLIST_PRICING_HOSTS:-raw.githubusercontent.com}
      - SECURITY_URL_ALLOWLIST_CRS_HOSTS=${SECURITY_URL_ALLOWLIST_CRS_HOSTS:-}

      # =======================================================================
      # Gemini OAuth Configuration (optional)
      # =======================================================================
      - GEMINI_OAUTH_CLIENT_ID=${GEMINI_OAUTH_CLIENT_ID:-}
      - GEMINI_OAUTH_CLIENT_SECRET=${GEMINI_OAUTH_CLIENT_SECRET:-}
      - GEMINI_OAUTH_SCOPES=${GEMINI_OAUTH_SCOPES:-}
      - GEMINI_QUOTA_POLICY=${GEMINI_QUOTA_POLICY:-}

      # Built-in OAuth client secrets (optional)
      # SECURITY: This repo does not embed third-party client_secret.
      - GEMINI_CLI_OAUTH_CLIENT_SECRET=${GEMINI_CLI_OAUTH_CLIENT_SECRET:-}
      - ANTIGRAVITY_OAUTH_CLIENT_SECRET=${ANTIGRAVITY_OAUTH_CLIENT_SECRET:-}
      - ANTIGRAVITY_USER_AGENT_VERSION=${ANTIGRAVITY_USER_AGENT_VERSION:-}

      # =======================================================================
      # Image Generation Stream & Concurrency
      # =======================================================================
      # OpenAI HTTP upstream protocol/timeout
      - GATEWAY_OPENAI_RESPONSE_HEADER_TIMEOUT=${GATEWAY_OPENAI_RESPONSE_HEADER_TIMEOUT:-0}
      - GATEWAY_OPENAI_HTTP2_ENABLED=${GATEWAY_OPENAI_HTTP2_ENABLED:-true}
      - GATEWAY_OPENAI_HTTP2_ALLOW_PROXY_FALLBACK_TO_HTTP1=${GATEWAY_OPENAI_HTTP2_ALLOW_PROXY_FALLBACK_TO_HTTP1:-true}
      - GATEWAY_OPENAI_HTTP2_FALLBACK_ERROR_THRESHOLD=${GATEWAY_OPENAI_HTTP2_FALLBACK_ERROR_THRESHOLD:-2}
      - GATEWAY_OPENAI_HTTP2_FALLBACK_WINDOW_SECONDS=${GATEWAY_OPENAI_HTTP2_FALLBACK_WINDOW_SECONDS:-60}
      - GATEWAY_OPENAI_HTTP2_FALLBACK_TTL_SECONDS=${GATEWAY_OPENAI_HTTP2_FALLBACK_TTL_SECONDS:-600}
      - GATEWAY_IMAGE_STREAM_DATA_INTERVAL_TIMEOUT=${GATEWAY_IMAGE_STREAM_DATA_INTERVAL_TIMEOUT:-900}
      - GATEWAY_IMAGE_STREAM_KEEPALIVE_INTERVAL=${GATEWAY_IMAGE_STREAM_KEEPALIVE_INTERVAL:-10}
      - GATEWAY_IMAGE_CONCURRENCY_ENABLED=${GATEWAY_IMAGE_CONCURRENCY_ENABLED:-false}
      - GATEWAY_IMAGE_CONCURRENCY_MAX_CONCURRENT_REQUESTS=${GATEWAY_IMAGE_CONCURRENCY_MAX_CONCURRENT_REQUESTS:-0}
      - GATEWAY_IMAGE_CONCURRENCY_OVERFLOW_MODE=${GATEWAY_IMAGE_CONCURRENCY_OVERFLOW_MODE:-reject}
      - GATEWAY_IMAGE_CONCURRENCY_WAIT_TIMEOUT_SECONDS=${GATEWAY_IMAGE_CONCURRENCY_WAIT_TIMEOUT_SECONDS:-30}
      - GATEWAY_IMAGE_CONCURRENCY_MAX_WAITING_REQUESTS=${GATEWAY_IMAGE_CONCURRENCY_MAX_WAITING_REQUESTS:-100}
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  cloudbase_data:
    driver: local
