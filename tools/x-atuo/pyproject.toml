[project]
name = "sub2api-x-atuo"
version = "0.1.0"
description = "Vendored x_atuo runtime used by Sub2API Touch X imports."
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "curl_cffi>=0.7",
  "xclienttransaction>=1.0.1",
  "beautifulsoup4>=4.12",
  "PyJWT>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/x_atuo"]
